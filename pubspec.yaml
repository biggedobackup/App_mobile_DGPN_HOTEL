name: dgpn_hotel
description: "Application mobile DGPN - Gestion Hôtelière"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  # Navigation
  go_router: ^13.0.0
  # HTTP & Stockage
  http: ^1.2.0
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  # JWT
  jwt_decoder: ^2.0.1
  # Images
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  path_provider: ^2.1.2
  connectivity_plus: ^6.1.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  # UI
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  intl: ^0.19.0
  # Icons
  flutter_svg: ^2.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
